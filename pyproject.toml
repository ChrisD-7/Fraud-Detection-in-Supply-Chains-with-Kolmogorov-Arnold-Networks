[project]
name = "kan-fraud"
version = "0.1.0"
description = "KAN fraud detection on the DataCo supply-chain dataset, leak-free and reproducible"
requires-python = ">=3.9"
dependencies = [
    "pykan==0.2.8",
    "torch>=2.2",
    "numpy",
    "pandas",
    "scikit-learn",
    "imbalanced-learn",
    "matplotlib",
    "seaborn",
    "sympy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kan-fraud = "kan_fraud.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
