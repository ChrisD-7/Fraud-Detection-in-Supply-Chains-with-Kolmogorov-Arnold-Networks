# Full dataset (180,519 rows). Slow on CPU: use the GPU or a smaller n_sample.
data:
  zip_path: DataCoSupplyChainDataset.zip
  n_sample: null
  seed: 42
  test_size: 0.2
  split_strategy: grouped
  balance: adasyn

model:
  hidden: 6
  grid: 5
  k: 3
  seed: 1
  device: auto
  optimiser: LBFGS
  steps: 20
  lamb: 0.0
  loss: cross_entropy

symbolic:
  enabled: true
  r2_threshold: 0.8
  prune: true

output:
  results_dir: results
  run_name: full
